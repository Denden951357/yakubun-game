<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV用 かんたん約分プラクティス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 1920x1080 基準のステージ */
    #app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #app-container {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: absolute;
      transform-origin: center center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      height: 100px;
      padding: 0 40px;
      background: rgba(30, 41, 59, 0.8);
      border-bottom: 4px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .title-area h1 {
      font-size: 42px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    .badge {
      background-color: #f59e0b;
      color: #0f172a;
      font-size: 22px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
    }

    .header-controls {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .tv-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      transition: all 0.2s;
    }

    .tv-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }

    /* メインコンテンツエリア */
    main {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* スタート画面 */
    .start-card {
      background: rgba(30, 41, 59, 0.9);
      border: 4px solid #475569;
      border-radius: 32px;
      padding: 50px;
      width: 1600px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .menu-section {
      margin-bottom: 40px;
    }

    .menu-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .menu-title.easy { color: #4ade80; }
    .menu-title.hard { color: #fb923c; }

    .button-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .mode-btn {
      border: none;
      padding: 24px;
      font-size: 32px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      box-shadow: 0 8px 0 rgba(0,0,0,0.3);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mode-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .mode-btn.easy-btn {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: 3px solid #4ade80;
    }

    .mode-btn.easy-btn:hover {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .mode-btn.hard-btn {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      border: 3px solid #fb923c;
    }

    .mode-btn.hard-btn:hover {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    .sub-text {
      font-size: 20px;
      opacity: 0.9;
      font-weight: normal;
    }

    /* ゲームプレイ画面 */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      width: 1700px;
      height: 880px;
    }

    /* 左側：問題 & ピザ表示 */
    .left-panel {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 28px;
      border: 3px solid #334155;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .progress-bar-container {
      width: 100%;
      background: #0f172a;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.3s ease;
    }

    .problem-box {
      display: flex;
      align-items: center;
      gap: 40px;
      margin: 20px 0;
    }

    .fraction-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 80px;
      font-weight: bold;
      color: #f8fafc;
    }

    .fraction-line {
      width: 140px;
      height: 8px;
      background-color: #f8fafc;
      margin: 12px 0;
      border-radius: 4px;
    }

    .equals-sign {
      font-size: 80px;
      font-weight: bold;
      color: #38bdf8;
    }

    /* 解答入力部分 */
    .input-fraction {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-box {
      width: 140px;
      height: 110px;
      background: #0f172a;
      border: 5px solid #475569;
      border-radius: 20px;
      font-size: 72px;
      font-weight: bold;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .input-box.active {
      border-color: #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      background: #1e293b;
    }

    .viz-container {
      width: 100%;
      height: 320px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      border: 2px dashed #475569;
    }

    .viz-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .viz-item canvas {
      background: transparent;
    }

    .viz-label {
      font-size: 22px;
      color: #94a3b8;
      font-weight: bold;
    }

    /* 右側：キーパッド & ヒント */
    .right-panel {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 28px;
      border: 3px solid #334155;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      justify-content: space-between;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .num-btn {
      height: 110px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 48px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #1e293b;
      transition: all 0.1s;
    }

    .num-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e293b;
    }

    .num-btn.clear-btn {
      background: #e11d48;
      box-shadow: 0 6px 0 #9f1239;
      font-size: 28px;
    }

    .num-btn.clear-btn:active {
      box-shadow: 0 2px 0 #9f1239;
    }

    .hints-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid #334155;
    }

    .hint-title {
      font-size: 24px;
      color: #f59e0b;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .hint-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .hint-btn {
      flex: 1;
      height: 70px;
      background: #475569;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hint-btn.active {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    .submit-btn {
      height: 110px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 44px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #14532d;
      transition: all 0.15s;
    }

    .submit-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #14532d;
    }

    /* フィードバック演出 */
    .feedback-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .hanamaru {
      width: 400px;
      height: 400px;
      border: 20px solid #ef4444;
      border-radius: 50%;
      color: #ef4444;
      font-size: 160px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(0) rotate(-20deg);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .hanamaru.show {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* リザルト画面 */
    .result-card {
      background: rgba(30, 41, 59, 0.95);
      border: 4px solid #38bdf8;
      border-radius: 36px;
      padding: 60px;
      width: 1200px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .result-title {
      font-size: 64px;
      color: #38bdf8;
      font-weight: 800;
    }

    .result-score {
      font-size: 100px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
    }

    .result-stats {
      font-size: 36px;
      color: #cbd5e1;
      display: flex;
      gap: 60px;
    }

    .restart-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 24px 80px;
      font-size: 40px;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 8px 0 #1e40af;
      transition: all 0.2s;
      margin-top: 20px;
    }

    .restart-btn:hover {
      transform: scale(1.05);
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    <div id="app-container">
      <!-- ヘッダー -->
      <header>
        <div class="title-area">
          <h1>約分プラクティス</h1>
          <span class="badge" id="mode-badge">初級モード</span>
        </div>
        <div class="header-controls">
          <button class="tv-btn" id="fullscreen-btn">📺 テレビモード</button>
        </div>
      </header>

      <!-- メインエリア -->
      <main>
        <canvas id="confetti-canvas"></canvas>
        <div class="feedback-overlay">
          <div class="hanamaru" id="hanamaru">💮</div>
        </div>

        <!-- 1. スタート画面 -->
        <section id="start-screen" class="screen active">
          <div class="start-card">
            <!-- 初級セクション -->
            <div class="menu-section">
              <div class="menu-title easy">
                <span>🌱 初級（まずはここから！ わり算1回でできる）</span>
              </div>
              <div class="button-row">
                <button class="mode-btn easy-btn" onclick="startGame('easy', 5)">
                  5もん
                  <span class="sub-text">サクッと練習</span>
                </button>
                <button class="mode-btn easy-btn" onclick="startGame('easy', 10)">
                  10もん
                  <span class="sub-text">しっかり練習</span>
                </button>
                <button class="mode-btn easy-btn" onclick="startGame('easy', 20)">
                  20もん
                  <span class="sub-text">たっぷりバッチリ</span>
                </button>
                <button class="mode-btn easy-btn" onclick="startGame('easy', Infinity)">
                  むげん
                  <span class="sub-text">ずっと挑戦</span>
                </button>
              </div>
            </div>

            <!-- 上級セクション -->
            <div class="menu-section" style="margin-bottom: 0;">
              <div class="menu-title hard">
                <span>🔥 上級（すこし難しい問題にチャレンジ！）</span>
              </div>
              <div class="button-row">
                <button class="mode-btn hard-btn" onclick="startGame('hard', 5)">
                  5もん
                  <span class="sub-text">サクッと挑戦</span>
                </button>
                <button class="mode-btn hard-btn" onclick="startGame('hard', 10)">
                  10もん
                  <span class="sub-text">しっかり挑戦</span>
                </button>
                <button class="mode-btn hard-btn" onclick="startGame('hard', 20)">
                  20もん
                  <span class="sub-text">たっぷり挑戦</span>
                </button>
                <button class="mode-btn hard-btn" onclick="startGame('hard', Infinity)">
                  むげん
                  <span class="sub-text">ずっと挑戦</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 2. ゲームプレイ画面 -->
        <section id="game-screen" class="screen">
          <div class="game-layout">
            <!-- 左パネル：問題とピザ -->
            <div class="left-panel">
              <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
              </div>

              <div class="problem-box">
                <!-- 元の分数 -->
                <div class="fraction-display">
                  <span id="orig-num">6</span>
                  <div class="fraction-line"></div>
                  <span id="orig-den">8</span>
                </div>

                <div class="equals-sign">=</div>

                <!-- 解答入力欄（上が分子、下が分母） -->
                <div class="input-fraction">
                  <!-- 分子（上） -->
                  <div class="input-box" id="input-num" onclick="selectInput('num')"></div>
                  <div class="fraction-line"></div>
                  <!-- 分母（下） -->
                  <div class="input-box" id="input-den" onclick="selectInput('den')"></div>
                </div>
              </div>

              <!-- ピザ（円グラフ）図解 -->
              <div class="viz-container">
                <div class="viz-item">
                  <canvas id="viz-orig" width="220" height="220"></canvas>
                  <span class="viz-label">もとの大きさ</span>
                </div>
                <div class="viz-item">
                  <canvas id="viz-ans" width="220" height="220"></canvas>
                  <span class="viz-label">あなたのこたえ</span>
                </div>
              </div>
            </div>

            <!-- 右パネル：テンキー・ヒント -->
            <div class="right-panel">
              <div class="numpad">
                <button class="num-btn" onclick="pressNum(1)">1</button>
                <button class="num-btn" onclick="pressNum(2)">2</button>
                <button class="num-btn" onclick="pressNum(3)">3</button>
                <button class="num-btn" onclick="pressNum(4)">4</button>
                <button class="num-btn" onclick="pressNum(5)">5</button>
                <button class="num-btn" onclick="pressNum(6)">6</button>
                <button class="num-btn" onclick="pressNum(7)">7</button>
                <button class="num-btn" onclick="pressNum(8)">8</button>
                <button class="num-btn" onclick="pressNum(9)">9</button>
                <button class="num-btn clear-btn" onclick="pressClear()">なおす</button>
              </div>

              <div class="hints-container">
                <div class="hint-title">💡 なんの数でわれるかな？</div>
                <div class="hint-buttons">
                  <button class="hint-btn" id="hint-2" onclick="checkHint(2)">2でわる</button>
                  <button class="hint-btn" id="hint-3" onclick="checkHint(3)">3でわる</button>
                  <button class="hint-btn" id="hint-5" onclick="checkHint(5)">5でわる</button>
                </div>
              </div>

              <button class="submit-btn" onclick="checkAnswer()">こたえあわせ</button>
            </div>
          </div>
        </section>

        <!-- 3. リザルト画面 -->
        <section id="result-screen" class="screen">
          <div class="result-card">
            <div class="result-title">クリア！ おめでとう！</div>
            <div class="result-score" id="result-score">10 / 10 問正解</div>
            <div class="result-stats">
              <span>⏱️ かかったじかん: <strong id="result-time" style="color: #38bdf8;">00:45</strong></span>
            </div>
            <button class="restart-btn" onclick="showStartScreen()">もういちどあそぶ</button>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script>
    /* ===================================================
       1. 1920x1080 画面への自動ストレッチ・フィット処理
       =================================================== */
    function resizeApp() {
      const container = document.getElementById('app-container');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const baseWidth = 1920;
      const baseHeight = 1080;

      // 16:9を維持するスケール値を計算
      const scaleX = windowWidth / baseWidth;
      const scaleY = windowHeight / baseHeight;
      const scale = Math.min(scaleX, scaleY);

      container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeApp);
    window.addEventListener('DOMContentLoaded', resizeApp);

    /* フルスクリーン切り替え */
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    });

    /* ===================================================
       2. Web Audio API 音声効果音
       =================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'select') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        // ピンポン（和音）
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        // ブブー
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'fanfare') {
        // ファンファーレ
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + idx * 0.12);
          g.gain.setValueAtTime(0.2, now + idx * 0.12);
          g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
          o.start(now + idx * 0.12);
          o.stop(now + idx * 0.12 + 0.3);
        });
      }
    }

    /* ===================================================
       3. アプリの状態管理 & ロジック
       =================================================== */
    let currentMode = 'easy'; // 'easy' or 'hard'
    let totalQuestions = 5;
    let currentQuestionIdx = 0;
    let correctCount = 0;
    let startTime = null;

    let currentProblem = { origNum: 0, origDen: 0, ansNum: 0, ansDen: 0 };
    let selectedInput = 'den'; // 初期フォーカスは「分母(den)」

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    /* 問題生成（初級：約分前が20未満＆1ステップ、上級：標準） */
    function generateProblem(mode) {
      const primes = [2, 3, 5];
      let ansNum, ansDen, factor;

      if (mode === 'easy') {
        // 初級：割る数は2,3,5のいずれか1つ（1ステップ）で、約分前の分子・分母がどちらも20未満
        do {
          ansNum = Math.floor(Math.random() * 8) + 1; // 1~8
          ansDen = Math.floor(Math.random() * 8) + 2; // 2~9
          factor = primes[Math.floor(Math.random() * primes.length)];
        } while (
          ansNum >= ansDen || 
          gcd(ansNum, ansDen) !== 1 || 
          (ansNum * factor) >= 20 || 
          (ansDen * factor) >= 20
        );
      } else {
        // 上級：約分前が30以下程度
        do {
          ansNum = Math.floor(Math.random() * 8) + 1;
          ansDen = Math.floor(Math.random() * 8) + 2;
          factor = primes[Math.floor(Math.random() * primes.length)];
          // たまに公約数を大きくする
          if (Math.random() > 0.5) {
            factor *= primes[Math.floor(Math.random() * 2)]; // x2 or x3
          }
        } while (
          ansNum >= ansDen || 
          gcd(ansNum, ansDen) !== 1 || 
          (ansNum * factor) > 30 || 
          (ansDen * factor) > 30
        );
      }

      return {
        origNum: ansNum * factor,
        origDen: ansDen * factor,
        ansNum: ansNum,
        ansDen: ansDen
      };
    }

    /* 画面遷移 */
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showStartScreen() {
      showScreen('start-screen');
    }

    function startGame(mode, count) {
      playSound('select');
      currentMode = mode;
      totalQuestions = count;
      currentQuestionIdx = 0;
      correctCount = 0;
      startTime = new Date();

      document.getElementById('mode-badge').innerText = mode === 'easy' ? '🌱 初級モード' : '🔥 上級モード';
      document.getElementById('mode-badge').style.backgroundColor = mode === 'easy' ? '#4ade80' : '#fb923c';

      showScreen('game-screen');
      nextQuestion();
    }

    function nextQuestion() {
      if (currentQuestionIdx >= totalQuestions) {
        endGame();
        return;
      }

      currentProblem = generateProblem(currentMode);

      // UI描画
      document.getElementById('orig-num').innerText = currentProblem.origNum;
      document.getElementById('orig-den').innerText = currentProblem.origDen;
      document.getElementById('input-num').innerText = '';
      document.getElementById('input-den').innerText = '';

      // プログレスバー
      const progress = totalQuestions === Infinity ? 100 : (currentQuestionIdx / totalQuestions) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;

      // ヒントボタンリセット
      [2, 3, 5].forEach(k => {
        document.getElementById(`hint-${k}`).classList.remove('active');
      });

      // ⭐ 要望①：初期フォーカスを「分母(den)」にする
      selectInput('den');

      // ピザ描画
      drawPizza('viz-orig', currentProblem.origNum, currentProblem.origDen);
      drawPizza('viz-ans', 0, 1);
    }

    /* カーソル選択 */
    function selectInput(target) {
      playSound('select');
      selectedInput = target;
      document.getElementById('input-num').classList.toggle('active', target === 'num');
      document.getElementById('input-den').classList.toggle('active', target === 'den');
    }

    /* テンキー押下 */
    function pressNum(num) {
      playSound('select');
      const box = document.getElementById(`input-${selectedInput}`);
      box.innerText = num; // 1桁制限

      // ピザリアルタイム更新
      updateAnsViz();

      if (selectedInput === 'den') {
        // ⭐ 要望②：分母を入力したら自動で分子(num)へ移動
        selectInput('num');
      } else if (selectedInput === 'num') {
        // 両方埋まったかチェック
        checkAutoSubmit();
      }
    }

    /* クリア（なおす）押下 */
    function pressClear() {
      playSound('select');
      const box = document.getElementById(`input-${selectedInput}`);
      if (box.innerText !== '') {
        box.innerText = '';
      } else if (selectedInput === 'num') {
        // 分子が空の状態で消すと分母へフォーカスが戻る
        selectInput('den');
      }
      updateAnsViz();
    }

    /* ⭐ 要望③：分母と分子が揃ったら自動答え合わせ */
    function checkAutoSubmit() {
      const numVal = document.getElementById('input-num').innerText;
      const denVal = document.getElementById('input-den').innerText;

      if (numVal !== '' && denVal !== '') {
        setTimeout(() => {
          checkAnswer();
        }, 300); // 0.3秒だけ入力を見せてから自動判定
      }
    }

    function updateAnsViz() {
      const numVal = parseInt(document.getElementById('input-num').innerText) || 0;
      const denVal = parseInt(document.getElementById('input-den').innerText) || 1;
      drawPizza('viz-ans', numVal, denVal);
    }

    /* ヒント確認 */
    function checkHint(factor) {
      playSound('select');
      const btn = document.getElementById(`hint-${factor}`);
      if (currentProblem.origNum % factor === 0 && currentProblem.origDen % factor === 0) {
        btn.classList.add('active');
      } else {
        btn.style.opacity = '0.3';
        setTimeout(() => { btn.style.opacity = '1'; }, 500);
      }
    }

    /* 答え合わせ */
    function checkAnswer() {
      const userNum = parseInt(document.getElementById('input-num').innerText);
      const userDen = parseInt(document.getElementById('input-den').innerText);

      if (isNaN(userNum) || isNaN(userDen)) return;

      if (userNum === currentProblem.ansNum && userDen === currentProblem.ansDen) {
        // 正解
        playSound('correct');
        showHanamaru();
        correctCount++;
        currentQuestionIdx++;
        setTimeout(() => {
          nextQuestion();
        }, 1200);
      } else {
        // 不正解
        playSound('wrong');
        const layout = document.querySelector('.game-layout');
        layout.style.transform = 'translateX(-10px)';
        setTimeout(() => layout.style.transform = 'translateX(10px)', 50);
        setTimeout(() => layout.style.transform = 'translateX(-10px)', 100);
        setTimeout(() => layout.style.transform = 'translateX(0)', 150);
      }
    }

    function showHanamaru() {
      const el = document.getElementById('hanamaru');
      el.classList.add('show');
      setTimeout(() => {
        el.classList.remove('show');
      }, 1000);
    }

    /* リザルト画面 */
    function endGame() {
      playSound('fanfare');
      showScreen('result-screen');
      startConfetti();

      const elapsed = Math.floor((new Date() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      if (totalQuestions === Infinity) {
        document.getElementById('result-score').innerText = `${correctCount} 問正解！`;
      } else {
        document.getElementById('result-score').innerText = `${totalQuestions} / ${totalQuestions} 問正解！`;
      }
      document.getElementById('result-time').innerText = `${mins}:${secs}`;
    }

    /* ピザ（円グラフ）描画 */
    function drawPizza(canvasId, num, den) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 90;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (den <= 0) den = 1;
      const sliceAngle = (Math.PI * 2) / den;

      // 背景の円
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 分子部分を塗る
      for (let i = 0; i < num && i < den; i++) {
        const start = -Math.PI / 2 + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // 枠線グリッド
      for (let i = 0; i < den; i++) {
        const angle = -Math.PI / 2 + i * sliceAngle;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    /* キーボード入力対応（リモコン/テンキー） */
    window.addEventListener('keydown', (e) => {
      const activeScreen = document.querySelector('.screen.active').id;
      if (activeScreen !== 'game-screen') return;

      if (e.key >= '1' && e.key <= '9') {
        pressNum(parseInt(e.key));
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        pressClear();
      } else if (e.key === 'ArrowUp') {
        selectInput('num');
      } else if (e.key === 'ArrowDown') {
        selectInput('den');
      } else if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    /* 紙吹雪（Confetti）演出 */
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1920;
      canvas.height = 1080;

      const particles = [];
      const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 12 + 6,
          speedY: Math.random() * 5 + 3,
          speedX: Math.random() * 2 - 1,
          rot: Math.random() * 360
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rot += 2;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (particles.some(p => p.y < canvas.height)) {
          requestAnimationFrame(render);
        }
      }
      render();
    }
  </script>
</body>
