<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしく！やくぶんれんしゅう</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 徹底的なボックスサイジングとスクロール禁止 */
        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1e1035;
            background: radial-gradient(circle at center, #2e1852 0%, #0f071e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        /* 16:9比率を厳密に保持し、最大サイズで中央に収まるレスポンシブコンテナ */
        #appContainer {
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-height: 100vh;
            max-width: calc(100vh * 16 / 9);
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: #fffaf0;
            background-image: radial-gradient(#ffd8a8 2px, transparent 2px);
            background-size: 24px 24px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
            border-radius: 1.25rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Container queries enabled for responsive inner components */
            container-type: inline-size;
        }

        /* アニメーション & エフェクト */
        .btn-push {
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.18);
        }
        .btn-push:active {
            transform: translateY(3px) !important;
            box-shadow: 0 1px 0 rgba(0,0,0,0.18) !important;
        }

        /* フォーカスリング (テレビのリモコン用) */
        .focusable:focus-visible, .focusable:hover {
            outline: 4px solid #ff4757;
            outline-offset: 2px;
            transform: scale(1.02);
        }

        /* 入力ボックスのアクティブ状態 */
        .input-box-active {
            border-color: #ff4757 !important;
            background-color: #fff0f3 !important;
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.35) !important;
        }

        /* はなまるスタンプアニメーション */
        @keyframes stampPop {
            0% { transform: scale(3) rotate(-25deg); opacity: 0; }
            70% { transform: scale(0.9) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-stamp {
            animation: stampPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 画面フェード */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body>

    <!-- 16:9 TV CONTAINER -->
    <div id="appContainer">

        <!-- ================= HEADER BAR ================= -->
        <header class="w-full h-[12%] bg-white/90 backdrop-blur border-b-2 border-amber-200 px-4 flex items-center justify-between z-10 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="text-2xl md:text-3xl">✏️</span>
                <h1 class="text-lg md:text-2xl font-black text-rose-500 tracking-wide">
                    テレビでたのしく！やくぶんれんしゅう
                </h1>
            </div>

            <div class="flex items-center space-x-3">
                <!-- タイマー -->
                <div id="timerBadge" class="hidden items-center bg-amber-100 border border-amber-300 px-3 py-1 rounded-xl text-amber-900 font-extrabold text-sm md:text-base">
                    <span>⏱️</span><span id="timerText" class="ml-1 font-mono">00:00</span>
                </div>

                <!-- スコア -->
                <div class="flex items-center space-x-1.5 bg-yellow-100 border border-yellow-300 px-3 py-1 rounded-xl">
                    <span class="text-lg md:text-xl">⭐</span>
                    <span id="starScore" class="text-lg md:text-xl font-black text-amber-600">0</span>
                </div>

                <!-- 効果音オン/オフ -->
                <button id="soundToggleBtn" class="focusable bg-sky-100 hover:bg-sky-200 text-sky-900 px-2.5 py-1 rounded-xl font-bold text-xs md:text-sm border border-sky-300 flex items-center gap-1">
                    <span id="soundIcon">🔊</span> <span id="soundLabel">おと: オン</span>
                </button>

                <!-- テレビモード（フルスクリーン） -->

                    📺 テレビモード

            </div>
        </header>

        <!-- ================= MAIN CONTENT AREA ================= -->
        <main class="w-full h-[88%] relative overflow-hidden">

            <!-- ---------------- 1. START SCREEN ---------------- -->
            <section id="startScreen" class="w-full h-full flex flex-col items-center justify-between p-6 fade-in">
                <div class="text-center mt-2">

                        ✨ ２・３・５で わる かんたん約分 ✨

                    <h2 class="text-3xl md:text-5xl font-black text-gray-800 tracking-tight">

                    </h2>

                <!-- 問題数選択ボタン（グリッド） -->

                    <button data-count="5" class="mode-select-btn focusable btn-push bg-white border-4 border-rose-400 hover:bg-rose-50 rounded-3xl p-4 md:p-6 flex flex-col items-center justify-center space-y-2 cursor-pointer">

                        <span class="text-2xl md:text-4xl font-black text-rose-500">5 もん</span>

                </div>

        </main>

    <!-- AUDIO & GAME SYSTEM LOGIC -->
    <script>
        /* ===================================================================
           1. WEB AUDIO API (EFFECT SOUNDS)
           =================================================================== */
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                freqs.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.35);
                });
            }

            playWrong() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playTap() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.04);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            }

            playFanfare() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [
                    {f: 523.25, t: 0, d: 0.12},
                    {f: 523.25, t: 0.12, d: 0.12},
                    {f: 523.25, t: 0.24, d: 0.12},
                    {f: 659.25, t: 0.36, d: 0.3},
                    {f: 783.99, t: 0.66, d: 0.4}
                ];
                notes.forEach(n => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, now + n.t);
                    gain.gain.setValueAtTime(0.2, now + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + n.t);
                    osc.stop(now + n.t + n.d);
                });
            }
        }

        const snd = new SoundManager();

        /* ===================================================================
           2. FRACTION QUESTION GENERATOR
           =================================================================== */
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        // 分子・分母が30以下で、2, 3, 5で約分可能な良問リスト
        const QUESTION_BANK = [
            // 2で割れる
            {n:2, d:4}, {n:4, d:6}, {n:6, d:8}, {n:6, d:10}, {n:8, d:10},
            {n:4, d:12}, {n:6, d:12}, {n:10, d:12}, {n:8, d:14}, {n:12, d:16},
            {n:14, d:18}, {n:16, d:20}, {n:10, d:22}, {n:12, d:24}, {n:14, d:28},
            // 3で割れる
            {n:3, d:6}, {n:3, d:9}, {n:6, d:9}, {n:3, d:12}, {n:9, d:12},
            {n:6, d:15}, {n:9, d:15}, {n:12, d:15}, {n:9, d:18}, {n:15, d:18},
            {n:12, d:21}, {n:15, d:21}, {n:15, d:24}, {n:18, d:27}, {n:21, d:30},
            // 5で割れる
            {n:5, d:10}, {n:5, d:15}, {n:10, d:15}, {n:5, d:20}, {n:10, d:20},
            {n:15, d:20}, {n:10, d:25}, {n:15, d:25}, {n:20, d:25}, {n:15, d:30},
            {n:20, d:30}, {n:25, d:30}
        ];

        /* ===================================================================
           3. GAME STATE
           =================================================================== */
        let state = {
            mode: 5, // 5, 10, 20, or 'infinite'
            qIndex: 1,
            stars: 0,
            currentQ: { n: 6, d: 12, simpleN: 1, simpleD: 2 },
            target: 'num', // 'num' or 'den'
            ansNum: '',
            ansDen: '',
            pizzaVisible: true,
            timerTimer: null,
            elapsedSec: 0
        };

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');

        const qNumerator = document.getElementById('qNumerator');
        const qDenominator = document.getElementById('qDenominator');
        const ansNumText = document.getElementById('ansNumText');
        const ansDenText = document.getElementById('ansDenText');

        const inputNumBtn = document.getElementById('inputNumBtn');
        const inputDenBtn = document.getElementById('inputDenBtn');

        const questionNumText = document.getElementById('questionNumText');
        const starScore = document.getElementById('starScore');
        const timerBadge = document.getElementById('timerBadge');
        const timerText = document.getElementById('timerText');

        const pizzaArea = document.getElementById('pizzaArea');
        const pizzaOrigText = document.getElementById('pizzaOrigText');
        const pizzaAnsText = document.getElementById('pizzaAnsText');
        const pizzaOrigCanvas = document.getElementById('pizzaOrigCanvas');
        const pizzaAnsCanvas = document.getElementById('pizzaAnsCanvas');

        const stampOverlay = document.getElementById('stampOverlay');

        /* ===================================================================
           4. INIT & EVENT BINDINGS
           =================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            bindEvents();
            setupKeyboardNav();
        });

        function bindEvents() {
            // Mode buttons
            document.querySelectorAll('.mode-select-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const count = btn.getAttribute('data-count');
                    startGame(count === 'infinite' ? 'infinite' : parseInt(count, 10));
                });
            });

            // Target switches
            inputNumBtn.addEventListener('click', () => setTarget('num'));
            inputDenBtn.addEventListener('click', () => setTarget('den'));
            document.getElementById('switchTargetBtn').addEventListener('click', () => {
                snd.playTap();
                setTarget(state.target === 'num' ? 'den' : 'num');
            });

            // Keypad
            document.querySelectorAll('.key-btn').forEach(btn => {
                btn.addEventListener('click', () => pressDigit(btn.getAttribute('data-num')));
            });

            document.getElementById('bsKeyBtn').addEventListener('click', pressBackspace);
            document.getElementById('clearKeyBtn').addEventListener('click', pressClear);
            document.getElementById('submitAnswerBtn').addEventListener('click', checkAnswer);

            // Controls
            document.getElementById('exitGameBtn').addEventListener('click', gotoStart);
            document.getElementById('skipGameBtn').addEventListener('click', skipQuestion);
            document.getElementById('retryBtn').addEventListener('click', () => startGame(state.mode));
            document.getElementById('homeBtn').addEventListener('click', gotoStart);

            // Toggles
            document.getElementById('togglePizzaBtn').addEventListener('click', togglePizza);
            document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);
            document.getElementById('tvModeBtn').addEventListener('click', toggleFullscreen);

            // Hints
            document.querySelectorAll('.hint-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const divisor = parseInt(btn.getAttribute('data-div'), 10);
                    snd.playTap();
                    showHint(divisor);
                });
            });
        }

        /* ===================================================================
           5. GAME ENGINE
           =================================================================== */
        function startGame(mode) {
            snd.playTap();
            state.mode = mode;
            state.qIndex = 1;
            state.stars = 0;
            state.elapsedSec = 0;

            starScore.innerText = state.stars;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');

            if (mode !== 'infinite') {
                timerBadge.classList.remove('hidden');
                timerBadge.classList.add('flex');
                startTimer();
            } else {
                timerBadge.classList.add('hidden');
                clearInterval(state.timerTimer);
            }

            nextQuestion();
        }

        function gotoStart() {
            snd.playTap();
            clearInterval(state.timerTimer);
            gameScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        function startTimer() {
            clearInterval(state.timerTimer);
            const startTime = Date.now();
            state.timerTimer = setInterval(() => {
                state.elapsedSec = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(state.elapsedSec / 60).toString().padStart(2, '0');
                const s = (state.elapsedSec % 60).toString().padStart(2, '0');
                timerText.innerText = `${m}:${s}`;
            }, 1000);
        }

        function nextQuestion() {
            const raw = QUESTION_BANK[Math.floor(Math.random() * QUESTION_BANK.length)];
            const g = gcd(raw.n, raw.d);

            state.currentQ = {
                n: raw.n,
                d: raw.d,
                simpleN: raw.n / g,
                simpleD: raw.d / g
            };

            state.ansNum = '';
            state.ansDen = '';
            updateInputUI();
            setTarget('num');

            qNumerator.innerText = state.currentQ.n;
            qDenominator.innerText = state.currentQ.d;

            if (state.mode === 'infinite') {
                questionNumText.innerText = `だい ${state.qIndex} もん (むげん)`;
            } else {
                questionNumText.innerText = `だい ${state.qIndex} / ${state.mode} もん`;
            }

            stampOverlay.classList.add('hidden');
            if (state.pizzaVisible) drawPizzaDiagrams();
        }

        function setTarget(target) {
            state.target = target;
            if (target === 'num') {
                inputNumBtn.classList.add('input-box-active');
                inputDenBtn.classList.remove('input-box-active');
            } else {
                inputDenBtn.classList.add('input-box-active');
                inputNumBtn.classList.remove('input-box-active');
            }
        }

        function pressDigit(digit) {
            snd.playTap();
            if (state.target === 'num') {
                if (state.ansNum.length < 2) state.ansNum += digit;
            } else {
                if (state.ansDen.length < 2) state.ansDen += digit;
            }
            updateInputUI();
            if (state.pizzaVisible) drawPizzaDiagrams();
        }

        function pressBackspace() {
            snd.playTap();
            if (state.target === 'num') {
                state.ansNum = state.ansNum.slice(0, -1);
            } else {
                state.ansDen = state.ansDen.slice(0, -1);
            }
            updateInputUI();
            if (state.pizzaVisible) drawPizzaDiagrams();
        }

        function pressClear() {
            snd.playTap();
            if (state.target === 'num') {
                state.ansNum = '';
            } else {
                state.ansDen = '';
            }
            updateInputUI();
            if (state.pizzaVisible) drawPizzaDiagrams();
        }

        function updateInputUI() {
            ansNumText.innerText = state.ansNum || '?';
            ansDenText.innerText = state.ansDen || '?';
        }

        /* ===================================================================
           6. ANSWER CHECKING
           =================================================================== */
        function checkAnswer() {
            const uN = parseInt(state.ansNum, 10);
            const uD = parseInt(state.ansDen, 10);

            if (isNaN(uN) || isNaN(uD) || uD === 0) {
                snd.playWrong();
                showNotice("数字を 入力してね！");
                return;
            }

            const isFullyReduced = (uN === state.currentQ.simpleN) && (uD === state.currentQ.simpleD);
            const isEquivalent = (uN * state.currentQ.d === uD * state.currentQ.n);

            if (isFullyReduced) {
                snd.playCorrect();
                stampOverlay.classList.remove('hidden');
                state.stars++;
                starScore.innerText = state.stars;

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                }

                setTimeout(() => {
                    if (state.mode !== 'infinite' && state.qIndex >= state.mode) {
                        finishRound();
                    } else {
                        state.qIndex++;
                        nextQuestion();
                    }
                }, 1300);

            } else if (isEquivalent) {
                snd.playWrong();
                showNotice("⭕ おしい！もっと 小さく われるよ！");
            } else {
                snd.playWrong();
                showNotice("❌ ちがうみたい。もう一度 計算してみよう！");
            }
        }

        function skipQuestion() {
            snd.playTap();
            state.qIndex++;
            nextQuestion();
        }

        function finishRound() {
            clearInterval(state.timerTimer);
            snd.playFanfare();

            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('finalStars').innerText = `⭐ ${state.stars}`;
            const m = Math.floor(state.elapsedSec / 60).toString().padStart(2, '0');
            const s = (state.elapsedSec % 60).toString().padStart(2, '0');
            document.getElementById('finalTime').innerText = `${m}:${s}`;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
            }
        }

        /* ===================================================================
           7. VISUAL PIZZA & HINTS
           =================================================================== */
        function togglePizza() {
            snd.playTap();
            state.pizzaVisible = !state.pizzaVisible;
            if (state.pizzaVisible) {
                pizzaArea.classList.remove('hidden');
                pizzaArea.classList.add('flex');
                drawPizzaDiagrams();
            } else {
                pizzaArea.classList.add('hidden');
                pizzaArea.classList.remove('flex');
            }
        }

        function drawPizzaDiagrams() {
            const qN = state.currentQ.n;
            const qD = state.currentQ.d;
            pizzaOrigText.innerText = `${qN}/${qD}`;
            renderSliceCanvas(pizzaOrigCanvas, qN, qD, '#ff4757');

            const aN = parseInt(state.ansNum, 10) || 0;
            const aD = parseInt(state.ansDen, 10) || 1;
            pizzaAnsText.innerText = `${aN}/${aD}`;
            renderSliceCanvas(pizzaAnsCanvas, aN, aD, '#2ed573');
        }

        function renderSliceCanvas(canvas, num, den, color) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = w / 2 - 4;

            ctx.clearRect(0, 0, w, h);
            if (den <= 0) return;

            const slice = (2 * Math.PI) / den;

            for (let i = 0; i < den; i++) {
                const startA = i * slice - Math.PI / 2;
                const endA = startA + slice;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startA, endA);
                ctx.closePath();

                if (i < num) {
                    ctx.fillStyle = color;
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#f1f2f6';
                    ctx.fill();
                }
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function showHint(div) {
            const n = state.currentQ.n;
            const d = state.currentQ.d;
            if (n % div === 0 && d % div === 0) {
                showNotice(`💡 [ ${div} ] でわると ➔ ${n / div} / ${d / div} になるよ！`);
            } else {
                showNotice(`❌ ${n} と ${d} は 両方 [ ${div} ] では われなさそう...`);
            }
        }

        /* ===================================================================
           8. KEYBOARD / TV REMOTE NAVIGATION
           =================================================================== */
        function setupKeyboardNav() {
            document.addEventListener('keydown', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    pressDigit(e.key);
                } else if (e.key === 'Backspace') {
                    pressBackspace();
                } else if (e.key === 'Delete') {
                    pressClear();
                } else if (e.key === 'Enter' || e.key === ' ') {
                    if (!gameScreen.classList.contains('hidden')) checkAnswer();
                } else if (e.key === 'ArrowUp') {
                    setTarget('num');
                } else if (e.key === 'ArrowDown') {
                    setTarget('den');
                }
            });
        }

        /* ===================================================================
           9. UTILS
           =================================================================== */
        function showNotice(msg) {
            const popup = document.createElement('div');
            popup.className = 'fixed top-14 left-1/2 -translate-x-1/2 bg-amber-900 text-white font-black text-sm md:text-base px-6 py-2.5 rounded-2xl shadow-2xl z-50 border-2 border-yellow-300 fade-in pointer-events-none';
            popup.innerText = msg;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 2200);
        }

        function toggleSound() {
            snd.enabled = !snd.enabled;
            document.getElementById('soundIcon').innerText = snd.enabled ? '🔊' : '🔇';
            document.getElementById('soundLabel').innerText = snd.enabled ? 'おと: オン' : 'おと: オフ';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>
</body>
